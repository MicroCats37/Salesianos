services:
  redis:
    image: redis:7-alpine
    container_name: salesianos_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: salesianos_db
    environment:
      # PostgreSQL usa POSTGRES_* internamente; mapeamos desde DB_* del .env
      POSTGRES_DB: ${DB_NAME:-salesianos_db}
      POSTGRES_USER: ${DB_USER:-salesianos_user}
      # La contraseña NO tiene valor por defecto (A0-VER03-05): el despliegue
      # debe supplying `DB_PASSWORD` de forma explícita (archivo `.env` del
      # despliegue o variable de entorno del proceso). Si falta, `docker
      # compose` ABORTA antes de crear el contenedor, en vez de levantar
      # PostgreSQL con una credencial conocida por cualquiera.
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD es obligatoria para el despliegue (sin valor por defecto)}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-salesianos_user} -d ${DB_NAME:-salesianos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  scraper:
    build:
      context: worker/scraper
      dockerfile: Dockerfile
    container_name: salesianos_scraper
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: salesianos_backend
    env_file:
      - .env
    environment:
      # Django settings module — production por defecto, overridear en .env si es necesario
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      # Dentro de la red Docker, los servicios se comunican por service name.
      DB_HOST: db
      DB_PORT: 5432
      SCRAPER_URL: ${SCRAPER_URL}
      CHANNEL_LAYER_REDIS_URL: ${CHANNEL_LAYER_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      scraper:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
      # Volumen PERSISTENTE de media (FREEZE-MD-1.0.0 · FR-06 §2.1).
      # `MEDIA_ROOT` es estado durable de negocio: un archivo escrito NO es un
      # caché y no se regenera. Sin este volumen, cada `docker compose up`
      # perdería los logos y las imágenes ya subidos.
      - backend_media:/app/media
    restart: unless-stopped
    entrypoint: ["/app/docker/entrypoint.sh"]

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # El navegador entra por el proxy; /backend se reescribe a /api en Django.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend}
        NEXT_PUBLIC_COOKIE_SECURE: ${NEXT_PUBLIC_COOKIE_SECURE:-false}
        NEXT_PUBLIC_IS_TEST_UUID: ${NEXT_PUBLIC_IS_TEST_UUID:-false}
        NEXT_PUBLIC_DEBUG_GENERIC_FORM_ERRORS: ${NEXT_PUBLIC_DEBUG_GENERIC_FORM_ERRORS:-false}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:${PROXY_PORT:-7000}}
        NEXT_PUBLIC_AUTH_STORAGE_PREFIX: ${NEXT_PUBLIC_AUTH_STORAGE_PREFIX:-salesianos_auth}
        NEXT_PUBLIC_IZIPAY_ENABLED: ${NEXT_PUBLIC_IZIPAY_ENABLED:-false}
    container_name: salesianos_frontend
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOSTNAME: ${FRONTEND_HOSTNAME:-0.0.0.0}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend}
      NEXT_PUBLIC_COOKIE_SECURE: ${NEXT_PUBLIC_COOKIE_SECURE:-false}
      NEXT_PUBLIC_IS_TEST_UUID: ${NEXT_PUBLIC_IS_TEST_UUID:-false}
      NEXT_PUBLIC_DEBUG_GENERIC_FORM_ERRORS: ${NEXT_PUBLIC_DEBUG_GENERIC_FORM_ERRORS:-false}
      NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-http://localhost:${PROXY_PORT:-7000}}
      NEXT_PUBLIC_AUTH_STORAGE_PREFIX: ${NEXT_PUBLIC_AUTH_STORAGE_PREFIX:-salesianos_auth}
      NEXT_PUBLIC_IZIPAY_ENABLED: ${NEXT_PUBLIC_IZIPAY_ENABLED:-false}
      # URL the Next.js SERVER uses to reach Django. It is NOT a NEXT_PUBLIC_*
      # variable: it is read at runtime and it never reaches the browser.
      # The browser keeps using NEXT_PUBLIC_API_URL (/backend) through nginx.
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000/api}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: salesianos_proxy
    depends_on:
      - frontend
      - backend
    ports:
      # Unico puerto publico: el proxy enruta frontend y backend.
      - "${PROXY_PORT:-7000}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      # El servidor de archivos del despliegue lee el volumen de media en
      # modo SÓLO-LECTURA: el backend es su único escritor (FR-06 §2.1).
      - backend_media:/var/www/media:ro
    restart: unless-stopped

volumes:
  postgres_data:
  backend_static:
  # Volumen persistente de media (FREEZE-MD-1.0.0 · FR-06 §2.1).
  backend_media:
