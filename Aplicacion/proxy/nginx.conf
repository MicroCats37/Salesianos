events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Cloudflare: preserve the real protocol without false downgrades.
    map $http_cf_visitor $scheme_alt {
        default $scheme;
        "~https" "https";
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        location = /proxy-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Next-owned auth routes. These must stay on the frontend server.
        location = /api/auth/refresh {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme_alt;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location = /api/auth/logout {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme_alt;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Browser calls /backend/*; Django receives /api/*.
        location /backend/ {
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme_alt;
        }

        # Django admin and its static assets must bypass the Next.js app.
        location = /admin {
            return 301 $scheme_alt://$http_host/admin/;
        }

        location /admin/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme_alt;
        }

        location /_nested_admin/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme_alt;
        }

        location /static/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme_alt;
        }

        # Media (FREEZE-MD-1.0.0 · FR-06 §2.1).
        #
        # El despliegue sirve el volumen de media desde AQUÍ, no desde Django:
        # `MEDIA_ROOT` es un volumen persistente y el servidor de archivos del
        # despliegue lo expone sin pasar por el proceso del API. El montaje es
        # de SÓLO-LECTURA: el backend es su único escritor.
        #
        # El nombre del archivo lo deriva el servidor de un UUID y la extensión
        # del MIME DETECTADO (nunca del nombre del cliente), así que la URL es
        # inmutable: se puede cachear para siempre.
        location /media/ {
            alias /var/www/media/;
            try_files $uri =404;
            access_log off;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            expires 1y;
        }

        # StreamHub HLS is available on the Docker host. Keep its browser
        # requests same-origin and do not forward cross-site credentials.
        location /live/ {
            limit_except GET HEAD { deny all; }
            proxy_pass http://172.18.0.1:8776/hls/;
            proxy_http_version 1.1;
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            proxy_set_header Cookie "";
            proxy_buffering off;
            proxy_read_timeout 30s;
        }

        location /_next/ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme_alt;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme_alt;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
