services:
  db:
    image: postgres:16-alpine
    container_name: salesianos_db
    environment:
      POSTGRES_DB: ${DB_NAME:-salesianos_db}
      POSTGRES_USER: ${DB_USER:-salesianos_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-salesianos_user} -d ${DB_NAME:-salesianos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  scraper:
    build:
      context: ./worker/scraper
      dockerfile: Dockerfile
    container_name: salesianos_scraper
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: salesianos_backend
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      # Dentro de la red Docker, hablamos con la DB por su service name y puerto interno
      DB_HOST: db
      DB_PORT: 5432
      SCRAPER_URL: http://scraper:8001
    depends_on:
      db:
        condition: service_healthy
      scraper:
        condition: service_healthy
    volumes:
      - backend_static:/app/staticfiles
    restart: unless-stopped
    entrypoint: ["/app/docker/entrypoint.sh"]

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # Apuntamos al proxy porque el navegador solo conoce localhost:7000
        NEXT_PUBLIC_API_URL: /backend
    container_name: salesianos_frontend
    env_file:
      - frontend/.env.local
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: /backend
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: salesianos_proxy
    depends_on:
      - frontend
      - backend
    ports:
      - "${PROXY_PORT:-7000}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
  backend_static:
