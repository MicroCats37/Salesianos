services:
  nginx:
    image: nginx:1.27.3-alpine
    container_name: salesianos-proxy
    restart: unless-stopped
    ports:
      - "8011:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/proxy-health"]
      interval: 30s
      timeout: 10s
      retries: 3
